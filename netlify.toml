[build]
  publish = "."

# Betawise moved to its own site. Keep old links, bookmarks and shared posts working.
[[redirects]]
  from = "/betawise"
  to = "https://betawise.org/"
  status = 301
  force = true

[[redirects]]
  from = "/betawise/*"
  to = "https://betawise.org/:splat"
  status = 301
  force = true
